<style>
:root{--bg:#15132A;--card:#211E3D;--ink:#F1EEFF;--mute:#9C97C4;--ac:#35D0BA;--dg:#FF7A8A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F5F3FF;--card:#FFF;--ink:#1C1836;--mute:#6B6690;--ac:#0E8F7C;--dg:#D23A4E}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Devanagari","Hind",system-ui,sans-serif;min-height:100vh}
#app{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:20px;margin:0}
.mute{color:var(--mute);font-size:14px}
input,textarea{width:100%;background:var(--card);color:var(--ink);border:1.5px solid transparent;border-radius:12px;padding:13px;font:inherit;margin:6px 0}
input:focus,textarea:focus{outline:none;border-color:var(--ac)}
textarea{min-height:200px;resize:vertical}textarea.code{font-family:ui-monospace,Menlo,monospace;font-size:14px;white-space:pre}
button{font:inherit;border:0;border-radius:12px;padding:12px 18px;background:var(--ac);color:#0B1A18;font-weight:700;cursor:pointer}
button.g{background:var(--card);color:var(--ink)}button.d{background:transparent;color:var(--dg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.sec{background:var(--card);border-radius:16px;padding:18px 12px;text-align:center;cursor:pointer;min-height:104px;position:relative}
.sec b{display:block;font-size:34px}.sec span{font-size:15px}.sec i{position:absolute;top:8px;right:10px;font-style:normal;font-size:12px;color:var(--mute)}
.row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}.sp{flex:1}
.it{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;cursor:pointer;display:flex;gap:12px;align-items:center}
.it img{width:52px;height:52px;object-fit:cover;border-radius:10px}
.it p{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.med img,.med video{max-width:100%;border-radius:12px;margin:8px 0;display:block}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:2}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none}.hero{display:flex;gap:14px;align-items:center;padding:8px 0}.tip{background:var(--card);border-left:4px solid var(--ac);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}.chip{font-size:12px;color:var(--mute)}

const SEED={g1:[['शुरुआत के 5 नियम','1) ऐसी स्किल सीखें जिसकी माँग हो (वेबसाइट, एडिटिंग, सेल्स, डिज़ाइन)।\n2) पहले सेवा बेचें, इसमें पूँजी कम लगती है।\n3) हर आमदनी का एक हिस्सा पहले बचाएँ, फिर खर्च करें।\n4) कर्ज़ और "पैसा दोगुना" वाली स्कीम से दूर रहें।\n5) धैर्य रखें, बड़ा काम बनने में सालों लगते हैं।'],['बड़े व्यवसाय कैसे बनते हैं','ज़्यादातर बड़े व्यवसाय किसी असली समस्या को हल करके बनते हैं, जिसे बहुत लोग झेलते हैं। वे पहले छोटे स्तर पर शुरू होते हैं, ग्राहकों से सीखते हैं, फिर सिस्टम और टीम बनाकर बढ़ते हैं। कोई तय फ़ॉर्मूला या गारंटी नहीं है, लेकिन लगातार काम और सीख सबमें दिखती है।'],['आइडिया परखने के 5 सवाल','1) क्या समस्या असली है?\n2) पैसे कौन देगा?\n3) पहला ग्राहक कहाँ से मिलेगा?\n4) शुरू करने की लागत कितनी है?\n5) 30 दिन में इसे छोटे स्तर पर कैसे टेस्ट करूँ?'],['पहले 90 दिन की योजना','दिन 1-30: एक स्किल और एक सेवा चुनें, 5 लोगों से बात करें।\nदिन 31-60: पहला ग्राहक ढूँढें, काम देकर फ़ीडबैक लें।\nदिन 61-90: दाम तय करें, 3-5 ग्राहक बनाएँ, सिस्टम लिखकर रखें।'],['ठगी से बचाव','जो जल्दी और पक्का मुनाफ़ा बताए, पहले पैसे माँगे, या OTP और पासवर्ड पूछे, उससे दूर रहें। कोई भी निवेश करने से पहले खुद जाँचें।']],n1:[['लोकल बिज़नेस के लिए वेबसाइट और बुकिंग सिस्टम','होटल, लॉन, डेकोरेशन वालों को बनाकर बेचें। पहले 2-3 नमूने बनाएँ, फिर हर महीने का सपोर्ट शुल्क रखें।'],['रील्स और वीडियो एडिटिंग सेवा','दुकानदारों और कोचिंग वालों के लिए महीने के पैकेज में रील्स बनाएँ।'],['ऑनलाइन ट्यूशन या कोर्स','जो आपको अच्छा आता है वह सिखाएँ। पहले लाइव क्लास, फिर रिकॉर्डेड कोर्स।'],['फ्रीलांसिंग','डिज़ाइन, लेखन, कोडिंग या डेटा एंट्री के छोटे प्रोजेक्ट लेकर शुरू करें।'],['छोटा फ़ूड या टिफ़िन बिज़नेस','कम जगह और कम पूँजी से शुरू होता है। पहले आसपास के 20 घरों पर टेस्ट करें।'],['डिजिटल प्रोडक्ट','टेम्पलेट, ईबुक या नोट्स एक बार बनाकर बार-बार बेचें।']],n2:[['किसानों और गाँव के लिए ऐप','मंडी भाव, मौसम और सलाह एक जगह। पहले किसी एक गाँव में टेस्ट करें।'],['छोटे होटल और लॉन के लिए बुकिंग सॉफ़्टवेयर','सीधी बुकिंग से कमीशन बचता है, यही बिकने की बात है।'],['लोकल सेवाओं का ऐप','मिस्त्री, इलेक्ट्रीशियन, टेंट और डेकोरेशन एक ही जगह।']]};
const SEED2={y1:["तेरी आँखों में जो सुकून मिला है मुझे|दुनिया की भीड़ में वो कहीं नहीं मिलता", "नाम तेरा लबों पर आए तो दुआ बन जाता है|दिल तुझे सोचे तो सारा जहाँ बन जाता है", "तुझसे मिलकर लगा कि मैं अधूरा था|अब हर लम्हा मुझे पूरा सा लगता है", "मोहब्बत में शर्त नहीं होती साथ की|बस दिल चाहता है तेरा हाथ हर बात में", "तू पास हो तो वक़्त ठहर सा जाता है|तू दूर हो तो हर पल सदियों सा हो जाता है", "ख़ामोशी भी तुझसे बात कर लेती है|जब दिल तेरा नाम लेकर धड़क लेता है", "तेरी हँसी मेरी हर थकान का इलाज है|तेरा साथ मेरे हर सफ़र का ताज है", "चाँद से पूछा तुझसे प्यारा कौन है|वो भी मुस्कुराकर तेरा नाम ले गया", "इश्क़ वो नहीं जो सिर्फ़ पाने की चाह रखे|इश्क़ वो है जो हर हाल में निभाने की राह रखे", "तेरी यादों की ख़ुशबू से महकता है दिल|रात भर जागकर भी थकता नहीं ये दिल", "तुम मिले तो ज़िंदगी को मायने मिले|बिन कहे जैसे सारे जवाब मिले", "दिल की किताब में एक ही नाम लिखा है|बाक़ी हर पन्ना तेरे बिना सूना दिखा है", "सफ़र लंबा हो तो भी कोई ग़म नहीं|बस तू हमसफ़र रहे, इतना ही काफ़ी है", "तेरे बिना ये शाम भी अधूरी लगती है|तू साथ हो तो हर बात पूरी लगती है", "मोहब्बत में जो सुकून है तेरे इंतज़ार में|वो किसी मंज़िल के मिल जाने में भी नहीं", "तेरी एक झलक से दिन बन जाता है|तेरे ज़िक्र से हर ग़म सिमट जाता है", "न दौलत चाहिए न शोहरत का सहारा|बस तेरा साथ हो तो जीत लूँ जहान सारा", "तू जो मुस्कुराए तो बहार आ जाती है|वरना ये दुनिया बेरंग नज़र आती है", "हर दुआ में तेरा नाम माँगा है मैंने|रब से तुझे ही हर बार माँगा है मैंने", "वादा है तुझसे, हर मोड़ पर साथ रहूँगा|तू थामे रहना, मैं हर हाल में निभाऊँगा"],y2:["गिरकर उठना ही असली जीत है|हार मान लेना सबसे बड़ी हार है", "सपने वो नहीं जो सोते में आते हैं|सपने वो हैं जो सोने नहीं देते", "मंज़िल उन्हीं को मिलती है जो चलते हैं|बैठकर सोचने वाले बस सोचते रह जाते हैं", "मेहनत का फल देर से सही, मीठा होता है|सब्र रखने वाला ही आख़िर में जीतता है", "मुश्किलें आएँगी तो हौसला भी बढ़ेगा|हर तूफ़ान के बाद रास्ता साफ़ दिखेगा", "छोटी शुरुआत से मत घबराना कभी|हर बड़ा पेड़ भी कभी एक बीज ही था", "जो डर गया वो वहीं रुक गया|जो चल पड़ा उसे रास्ता मिल गया", "कल पर मत टालो जो आज हो सकता है|वक़्त किसी के लिए कभी नहीं रुकता है", "हालात बदलते हैं जब इरादे बदलते हैं|बस ख़ुद पर यक़ीन रखो, रास्ते बनते हैं", "आज की मेहनत कल की पहचान बनेगी|आज का पसीना कल की शान बनेगी", "हार से सीखो, हारकर मत बैठो|हर ठोकर एक नया सबक़ देती है", "जब तक साँस है, कोशिश जारी रखो|मंज़िल दूर सही, पर रास्ता तुम्हारा है", "अकेले चलने से मत घबराना कभी|काफ़िले उन्हीं के बनते हैं जो पहले चलते हैं", "लोग क्या कहेंगे, ये सोचना छोड़ दो|अपने काम से जवाब देना सीख लो", "वक़्त सबका आता है, बस इंतज़ार करो|और उस वक़्त के लिए ख़ुद को तैयार करो", "जो ठान लिया उसे कर दिखाना है|रुकना नहीं, बस आगे बढ़ते जाना है", "असफलता भी एक सीढ़ी है सफलता की|बस पाँव जमाकर आगे बढ़ना सीखो", "रात कितनी भी लंबी हो, सुबह ज़रूर आती है|कोशिश करने वालों की क़िस्मत भी मुस्कुराती है", "ख़ुद पर भरोसा हो तो कुछ नामुमकिन नहीं|बस क़दम बढ़ाने की देर है, राह कहीं गुम नहीं", "रोज़ थोड़ा-थोड़ा बेहतर बनते जाओ|एक दिन तुम ख़ुद अपनी मिसाल बन जाओ"]};
const NEW2=[['y1','❤️','प्रेम और मोहब्बत की शायरी'],['y2','🔥','मोटिवेशनल शायरी'],['y3','✍️','मेरी अपनी शायरी']].map(d=>({id:d[0],e:d[1],n:d[2],k:'t'}));
const DEF=[['ऐप आइडिया','📱','t'],['बिज़नेस आइडिया','💼','t'],['वीडियो आइडिया','🎬','t'],['फिल्म आइडिया','🎞️','t'],['कोड','💻','c'],['फ़ोटो','🖼️','p'],['वीडियो','📹','v'],['कॉपी की चीज़ें','📋','t']].map((d,i)=>({id:'s'+i,n:d[0],e:d[1],k:d[2]}));
let secs=(()=>{let a;try{a=JSON.parse(ls.g('secs'))}catch(e){}a=a||DEF;NEW.concat(NEW2).forEach(n=>{if(!a.find(x=>x.id===n.id))a.push(n)});return a})();
const saveSecs=()=>ls.s('secs',JSON.stringify(secs));
let db;const open=()=>new Promise((y,n)=>{const r=indexedDB.open('tijori',1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>{db=r.result;y()};r.onerror=()=>n(r.error)});
const tx=(m,f)=>new Promise((y,n)=>{const t=db.transaction('items',m),q=f(t.objectStore('items'));t.oncomplete=()=>y(q&&q.result);t.onerror=()=>n(t.error)});
const all=()=>tx('readonly',s=>s.getAll()),put=i=>tx('readwrite',s=>s.put(i)),del=id=>tx('readwrite',s=>s.delete(id)),clr=()=>tx('readwrite',s=>s.clear());
const hash=async p=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tj:'+p)))].map(x=>x.toString(16).padStart(2,'0')).join('');

const av=(z=48)=>ls.g('av')?`<img class="av" style="width:${z}px;height:${z}px" src="${ls.g('av')}">`:`<svg class="av" style="width:${z}px;height:${z}px" viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35D0BA"/><stop offset="1" stop-color="#7C6CFF"/></linearGradient></defs><circle cx="32" cy="32" r="31" fill="#15132A" stroke="url(#lg)" stroke-width="3"/><text x="32" y="41" font-size="26" font-weight="700" text-anchor="middle" fill="url(#lg)" font-family="sans-serif">RS</text></svg>`;
async function seed(){if(!ls.g('sd3')){const its=await all();for(const k in SEED2)if(!its.some(x=>x.sec===k))for(const v of SEED2[k]){const [l1,l2]=v.split('|');await put({id:'sh'+k+Math.random().toString(36).slice(2,8),sec:k,t:l1,b:l1+'\n'+l2,files:[],d:Date.now()})}ls.s('sd3','1')}if(ls.g('sd2'))return;const its=await all();for(const k in SEED)if(!its.some(x=>x.sec===k))for(const [t,b] of SEED[k])await put({id:'seed'+k+t.length+b.length,sec:k,t,b,files:[],d:Date.now()});ls.s('sd2','1')}
let cur=null,item=null,q='';
async function lock(){
 if(!ls.g('h')){A.innerHTML=`<h1>स्वागत है 👋</h1><p class="mute">पहली बार: नाम और पासवर्ड चुनें। पासवर्ड भूलने पर वापस पाने का तरीका नहीं है, इसलिए याद रखें।</p><input id="n" placeholder="आपका नाम"><input id="p" type="password" placeholder="पासवर्ड (कम से कम 4 अक्षर)"><input id="rq" placeholder="भूलने पर पूछा जाने वाला सवाल (जैसे: पहली स्कूल का नाम)"><input id="ra" placeholder="उसका जवाब"><button id="go">सेव करें</button>`;
  $('#go').onclick=async()=>{const n=$('#n').value.trim(),p=$('#p').value;if(!n||p.length<4)return toast('नाम और 4+ अक्षर का पासवर्ड डालें');ls.s('u',n);ls.s('h',await hash(p));const rq=$('#rq').value.trim(),ra=$('#ra').value.trim().toLowerCase();if(rq&&ra){ls.s('rq',rq);ls.s('ra',await hash(ra))}home()}}
 else{A.innerHTML=`<div class="hero">${av(64)}<h1>नमस्ते ${esc(ls.g('u'))}</h1></div><p class="mute">पासवर्ड डालें</p><input id="p" type="password" placeholder="पासवर्ड"><button id="go">खोलें</button><p class="row"><button class="g" id="rs">बैकअप से वापस लाएँ</button><button class="g" id="fg">पासवर्ड भूल गए?</button></p>`;
  $('#fg').onclick=forgot;
  const go=async()=>{if(await hash($('#p').value)===ls.g('h'))home();else{toast('गलत पासवर्ड');$('#p').value=''}};
  $('#go').onclick=go;$('#p').onkeydown=e=>e.key==='Enter'&&go();$('#rs').onclick=restore}}
async function forgot(){if(ls.g('ra')){const a=prompt(ls.g('rq'));if(a&&await hash(a.trim().toLowerCase())===ls.g('ra')){const p=prompt('नया पासवर्ड (4+ अक्षर)');if(p&&p.length>=4){ls.s('h',await hash(p));toast('पासवर्ड बदल गया ✓')}}else toast('जवाब गलत है')}else if(prompt('रिकवरी सवाल सेट नहीं है। सारा डेटा मिटाकर नया शुरू करना हो तो लिखें: मिटाओ\n(अगर बैकअप है तो पहले “बैकअप से वापस लाएँ” दबाएँ)')==='मिटाओ'){await clr();['u','h','rq','ra','av','sd2','secs','lb'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});location.reload()}}
async function settings(){A.innerHTML=`<div class="top row"><button class="g" id="bk">←</button><h2 class="sp">⚙️ सेटिंग</h2></div><div class="hero">${av(72)}<div><b>${esc(ls.g('u'))}</b><br><span class="mute">फ़ोटो न हो तो RS लोगो दिखेगा</span></div></div>
<div class="row"><button class="g" id="ph">🖼️ मेरी फ़ोटो लगाएँ</button><button class="d" id="rp">फ़ोटो हटाएँ</button></div><input id="fp" type="file" accept="image/*" hidden>
<div class="row"><button class="g" id="cn">✏️ नाम बदलें</button><button class="g" id="cp">🔑 पासवर्ड बदलें</button><button class="g" id="cq">❓ भूलने का सवाल सेट करें</button></div>
<p class="mute">पासवर्ड भूलने पर लॉक स्क्रीन पर “पासवर्ड भूल गए?” दबाएँ और सवाल का जवाब दें।</p>`;
 $('#bk').onclick=home;$('#ph').onclick=()=>$('#fp').click();$('#rp').onclick=()=>{try{localStorage.removeItem('av')}catch(e){}settings()};
 $('#fp').onchange=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=200;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,200,200);ls.s('av',c.toDataURL('image/jpeg',.85));settings()};im.src=URL.createObjectURL(e.target.files[0])};
 $('#cn').onclick=()=>{const n=prompt('नया नाम',ls.g('u'));if(n){ls.s('u',n.trim());settings()}};
 $('#cp').onclick=async()=>{const o=prompt('पुराना पासवर्ड');if(await hash(o||'')!==ls.g('h'))return toast('पुराना पासवर्ड गलत है');const p=prompt('नया पासवर्ड (4+ अक्षर)');if(p&&p.length>=4){ls.s('h',await hash(p));toast('पासवर्ड बदल गया ✓')}};
 $('#cq').onclick=async()=>{const r=prompt('सवाल लिखें');const a=r&&prompt('उसका जवाब');if(r&&a){ls.s('rq',r.trim());ls.s('ra',await hash(a.trim().toLowerCase()));toast('सेव हो गया ✓')}}}
async function home(){await seed();cur=null;item=null;const its=await all();const lb=+ls.g('lb')||0,days=Math.floor((Date.now()-lb)/864e5);
 A.innerHTML=`<div class="hero">${av(56)}<div class="sp"><h1>${esc(ls.g('u'))}</h1><span class="mute">आपकी निजी तिजोरी</span></div><button class="g" id="st">⚙️</button></div>${!lb||days>=7?'<div class="tip">💾 '+(lb?days+' दिन से':'अभी तक')+' बैकअप नहीं लिया। नीचे “बैकअप लें” दबाकर सुरक्षित कर लें।</div>':''}
 <input id="sq" placeholder="🔍 सब जगह खोजें" value="${esc(q)}"><div id="res"></div>
 <div class="grid">${secs.map(s=>`<div class="sec" data-id="${s.id}"><i>${its.filter(x=>x.sec===s.id).length}</i><b>${s.e}</b><span>${esc(s.n)}</span></div>`).join('')}<div class="sec" id="add"><b>＋</b><span>नया सेक्शन</span></div></div>
 <div class="row"><button class="g" id="bk">💾 बैकअप लें</button><button class="g" id="rs">♻️ वापस लाएँ</button><button class="g" id="mg">⚙️ सेक्शन हटाएँ</button></div>
 <p class="mute">“बैकअप लें” दबाकर सीधे WhatsApp या Drive चुनकर भेज दें, बस एक टैप में।</p>`;
 document.querySelectorAll('.sec[data-id]').forEach(e=>e.onclick=()=>{cur=e.dataset.id;q='';list()});
 $('#add').onclick=()=>{const n=prompt('सेक्शन का नाम?');if(!n)return;const e=prompt('एक इमोजी (जैसे 📚)','📁')||'📁';const k=prompt('किस्म: t = लिखाई, c = कोड, p = फ़ोटो, v = वीडियो','t')||'t';secs.push({id:'s'+Date.now(),n,e,k:'tcpv'.includes(k)?k:'t'});saveSecs();home()};
 $('#bk').onclick=backup;$('#rs').onclick=restore;$('#st').onclick=settings;
 $('#mg').onclick=()=>{const n=prompt('हटाने वाले सेक्शन का नाम लिखें (उसकी सारी चीज़ें भी हट जाएँगी):');const s=secs.find(x=>x.n===n);if(!s)return toast('इस नाम का सेक्शन नहीं मिला');if(!confirm('पक्का हटाना है? "'+n+'"'))return;its.filter(x=>x.sec===s.id).forEach(x=>del(x.id));secs=secs.filter(x=>x!==s);saveSecs();home()};
 $('#sq').oninput=async e=>{q=e.target.value.trim().toLowerCase();const r=$('#res');if(!q){r.innerHTML='';return}const m=(await all()).filter(x=>(x.t+' '+x.b).toLowerCase().includes(q));r.innerHTML=m.map(x=>`<div class="it" data-i="${x.id}"><div><p><b>${esc(x.t||'(बिना नाम)')}</b></p><p class="mute">${esc((secs.find(s=>s.id===x.sec)||{}).n||'')}</p></div></div>`).join('')||'<p class="mute">कुछ नहीं मिला</p>';r.querySelectorAll('.it').forEach(e=>e.onclick=()=>{const x=m.find(y=>y.id===e.dataset.i);cur=x.sec;item=x;edit()})};
 if(q)$('#sq').oninput({target:$('#sq')})}
async function list(){const s=secs.find(x=>x.id===cur);const its=(await all()).filter(x=>x.sec===cur).sort((a,b)=>b.d-a.d);
 A.innerHTML=`<div class="top row"><button class="g" id="bk">←</button><h2 class="sp">${s.e} ${esc(s.n)}</h2><button id="nw">＋ नया</button></div>
 ${its.map(x=>{const f=(x.files||[]).find(f=>f.type.startsWith('image/'));return `<div class="it" data-i="${x.id}">${f?`<img src="${URL.createObjectURL(f.blob)}">`:''}<div style="min-width:0"><p><b>${esc(x.t||'(बिना नाम)')}</b></p><p class="mute">${esc((x.b||'').slice(0,60))}${x.files&&x.files.length?' 📎'+x.files.length:''}</p></div></div>`}).join('')||'<p class="mute">यहाँ अभी कुछ नहीं है। ऊपर “＋ नया” दबाएँ।</p>'}`;
 $('#bk').onclick=home;$('#nw').onclick=()=>{item={id:'i'+Date.now(),sec:cur,t:'',b:'',files:[],d:Date.now()};edit()};
 A.querySelectorAll('.it').forEach(e=>e.onclick=()=>{item=its.find(x=>x.id===e.dataset.i);edit()})}
function edit(){const s=secs.find(x=>x.id===cur);const fs=item.files||[];
 A.innerHTML=`<div class="top row"><button class="g" id="bk">←</button><h2 class="sp">${s.e} ${esc(s.n)}</h2><button id="sv">सेव</button></div>
 <input id="t" placeholder="हेडलाइन" value="${esc(item.t)}"><textarea id="b" class="${s.k==='c'?'code':''}" placeholder="यहाँ लिखें…">${esc(item.b)}</textarea>
 <div class="med">${fs.map((f,i)=>{const u=URL.createObjectURL(f.blob);return `<div>${f.type.startsWith('image/')?`<img src="${u}">`:f.type.startsWith('video/')?`<video src="${u}" controls playsinline></video>`:`<p>📄 ${esc(f.name)}</p>`}<button class="d" data-r="${i}">यह फ़ाइल हटाएँ</button></div>`}).join('')}</div>
 <div class="row"><button class="g" id="af">📎 फ़ोटो / वीडियो / फ़ाइल जोड़ें</button><button class="g" id="cp">कॉपी</button><span class="sp"></span><button class="d" id="dl">🗑️ हटाएँ</button></div><input id="fi" type="file" multiple hidden ${s.k==='p'?'accept="image/*"':s.k==='v'?'accept="video/*"':''}>`;
 const grab=()=>{item.t=$('#t').value;item.b=$('#b').value};
 $('#bk').onclick=async()=>{grab();if(item.t||item.b||fs.length)await put(item);list()};
 $('#sv').onclick=async()=>{grab();item.d=Date.now();await put(item);toast('सेव हो गया ✓')};
 $('#af').onclick=()=>$('#fi').click();
 $('#fi').onchange=async e=>{grab();for(const f of e.target.files)item.files.push({name:f.name,type:f.type||'application/octet-stream',blob:f});await put(item);edit()};
 A.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{grab();item.files.splice(+b.dataset.r,1);await put(item);edit()});
 $('#cp').onclick=()=>{grab();try{navigator.clipboard.writeText(item.b);toast('कॉपी हो गया')}catch(e){$('#b').select();document.execCommand('copy')}};
 $('#dl').onclick=async()=>{if(confirm('पक्का हटाना है?')){await del(item.id);list()}}}
const b64=b=>new Promise(y=>{const r=new FileReader();r.onload=()=>y(r.result);r.readAsDataURL(b)});
async function backup(){toast('बैकअप बन रहा है…');const items=await all();const out=[];for(const i of items)out.push({...i,files:await Promise.all((i.files||[]).map(async f=>({name:f.name,type:f.type,d:await b64(f.blob)})))});
 const data=JSON.stringify({v:1,u:ls.g('u'),h:ls.g('h'),secs,items:out});const fn='tijori-backup-'+new Date().toISOString().slice(0,10)+'.json';
 let ok=false;try{const f=new File([data],fn,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'तिजोरी बैकअप'});ok=true}}catch(e){if(e&&e.name==='AbortError')return}
 if(!ok)try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:fn,data});ok=true}else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=fn;a.click();ok=true}}catch(e){}
 if(ok){ls.s('lb',Date.now());toast('बैकअप तैयार ✓')}else toast('बैकअप सेव नहीं हुआ')}
function restore(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const j=JSON.parse(await i.files[0].text());if(!j.h||!j.items)throw 0;if(!confirm('मौजूदा डेटा की जगह बैकअप का डेटा आएगा। ठीक है?'))return;await clr();for(const x of j.items){x.files=await Promise.all((x.files||[]).map(async f=>({name:f.name,type:f.type,blob:await (await fetch(f.d)).blob()})));await put(x)}ls.s('u',j.u);ls.s('h',j.h);secs=j.secs;saveSecs();toast('वापस आ गया ✓');home()}catch(e){toast('यह सही बैकअप फ़ाइल नहीं है')}};i.click()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
open().then(lock).catch(()=>{A.innerHTML='<h1>स्टोरेज नहीं चल रहा</h1><p class="mute">Chrome में सामान्य (Incognito नहीं) टैब में खोलें।</p>'});
</script></body></html>
